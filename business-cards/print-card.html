<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Coreline - Business Card</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0C1210;
      --paper: #F6F7F5;
      --accent: #1F5C4B;
      --grey: #6E7A75;
      --hair: rgba(12, 18, 16, 0.16);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #DADAD6;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      padding: 40px;
    }

    .card {
      width: 3.5in;
      height: 2in;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ---------- FRONT ---------- */
    .front {
      background: var(--paper);
      color: var(--ink);
      padding: 0.28in;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 0.09in;
    }

    .icon {
      width: 0.32in;
      height: 0.32in;
      position: relative;
    }

    .icon svg {
      width: 100%;
      height: 100%;
    }

    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 17pt;
      letter-spacing: -0.01em;
    }

    .wordmark .dot {
      color: var(--accent);
    }

    .name-block {}

    .name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 12pt;
    }

    .title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7pt;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 2pt;
    }

    .contact-block {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7.5pt;
      color: var(--grey);
      line-height: 1.6;
    }

    .contact-block strong {
      color: var(--ink);
    }

    /* ---------- BACK ---------- */
    .back {
      background: var(--ink);
      color: var(--paper);
      padding: 0.28in;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 11pt;
      line-height: 1.3;
      max-width: 2.2in;
    }

    /* Adjusted for 2-line stacking */
    .pillars {
      display: flex;
      gap: 0.18in;
      margin-top: 0.1in;
    }

    .pillar {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 5.8pt;
      line-height: 1.45;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #8FBFA8;
    }

    .back-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .qr-box {
      width: 0.62in;
      height: 0.62in;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .site-url {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7pt;
      color: #9DA8A3;
    }

    /* ---------- PRINT ---------- */
    @page {
      size: 3.5in 2in;
      margin: 0;
    }

    @media print {

      html,
      body {
        background: none;
        padding: 0;
        margin: 0;
        gap: 0;
        width: 3.5in;
      }

      body {
        display: block;
      }

      .card {
        box-shadow: none;
        page-break-after: always;
        break-after: page;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .card:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>

<body>

  <div class="card front">
    <div class="logo-row">
      <div class="icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 20 H15 V40 M15 60 V80 H30" stroke="#1F5C4B" stroke-width="8" fill="none" />
          <rect x="42" y="42" width="16" height="16" fill="#1F5C4B" />
          <path d="M70 20 H85 V40 M85 60 V80 H70" stroke="#1F5C4B" stroke-width="8" fill="none" />
        </svg>
      </div>
      <div class="wordmark">coreline<span class="dot">.</span></div>
    </div>

    <div class="name-block">
      <div class="name">Shailesh Hawale</div>
      <div class="title">Founder, Coreline Digital</div>
    </div>

    <div class="contact-block">
      <strong>Phone / WhatsApp:</strong> +91 90823 08732<br>
      <strong>Web:</strong> corelinedigital.in
    </div>
  </div>

  <div class="card back">
    <div class="tagline">Digital infrastructure that drives revenue, not just traffic.</div>

    <div class="pillars">
      <div class="pillar">Websites that<br>convert</div>
      <div class="pillar">Leads, caught<br>instantly</div>
      <div class="pillar">Systems, kept<br>running</div>
    </div>

    <div class="back-bottom">
      <div class="site-url">corelinedigital.in/work</div>
      <div class="qr-box">
        <img src="qr.jpeg" alt="QR code - corelinedigital.in" width="150" height="150">
      </div>
    </div>
  </div>

</body>

</html>
